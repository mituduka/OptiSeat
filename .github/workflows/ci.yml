name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Lint (ruff)
        run: ruff check backend/
      - name: Test (pytest)
        run: pytest backend/tests/ -q

  frontend:
    name: Frontend (vitest + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check (tsc --noEmit)
        run: npm run lint
      - name: Test (vitest)
        run: npm test
      # tsc / vitest では検出できない Next.js 本番ビルドの破損（依存更新など）を検知する。
      # ジョブ名はブランチ保護の必須チェックに登録されているため変更しないこと。
      - name: Build (next build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
